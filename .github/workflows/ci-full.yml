name: CI (Full Matrix)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "${{ matrix.compiler }} C++${{ matrix.std }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== GCC =====
          # Linux jobs are pinned to images that preinstall their compiler:
          # ubuntu-latest moved to 26.04 (resolute), which no longer ships
          # clang-14 or clang-16, and downloading compilers from the runner
          # apt mirror can take tens of minutes. ubuntu-22.04 provides
          # gcc-11 and clang-14; ubuntu-24.04 provides the rest.
          - os: ubuntu-22.04
            compiler: gcc-11
            cxx: g++-11
            std: 17
          - os: ubuntu-22.04
            compiler: gcc-11
            cxx: g++-11
            std: 20
          - os: ubuntu-24.04
            compiler: gcc-13
            cxx: g++-13
            std: 23
          - os: ubuntu-24.04
            compiler: gcc-13
            cxx: g++-13
            std: 26

          # ===== Clang =====
          - os: ubuntu-22.04
            compiler: clang-14
            cxx: clang++-14
            std: 17
          - os: ubuntu-24.04
            compiler: clang-16
            cxx: clang++-16
            std: 20
          - os: ubuntu-24.04
            compiler: clang-18
            cxx: clang++-18
            std: 23
          - os: ubuntu-24.04
            compiler: clang-18
            cxx: clang++-18
            std: 26

          # ===== Windows: MSVC =====
          - os: windows-latest
            compiler: msvc
            std: 20
          - os: windows-latest
            compiler: msvc
            std: 23
          - os: windows-latest
            compiler: msvc
            std: 26

          # ===== Windows: clang-cl =====
          # Pinned to windows-2022: the windows-2025-vs2026 image bundles
          # Clang 22, which cmake < 4.2 cannot configure ("no known features
          # for CXX compiler Clang"). windows-2022 pairs VS2022 with a
          # cmake that still understands its clang-cl.
          - os: windows-2022
            compiler: clang-cl
            std: 20
          - os: windows-2022
            compiler: clang-cl
            std: 23
          - os: windows-2022
            compiler: clang-cl
            std: 26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Linux: install compilers
      - name: Setup Compiler (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ver=$(echo "${{ matrix.compiler }}" | cut -d'-' -f2)
          # Use the image's preinstalled compiler; fall back to apt only
          # when it is missing.
          if ! command -v "${{ matrix.cxx }}" >/dev/null; then
            sudo apt-get update
            if [[ "${{ matrix.compiler }}" == gcc* ]]; then
              sudo apt-get install -y gcc-${ver} g++-${ver}
            else
              sudo apt-get install -y clang-${ver}
            fi
          fi
          if [[ "${{ matrix.compiler }}" == gcc* ]]; then
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${ver} 100
          else
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${ver} 100
          fi
          "${{ matrix.cxx }}" --version

      # Windows: detect MSVC vs clang-cl
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          # windows-latest moved to windows-2025-vs2026, which ships only
          # Visual Studio 2026 (generator "Visual Studio 18 2026"); the old
          # VS 17 2022 instance no longer exists on the image.
          $generator = if (& cmake --version | Select-String "4\.") {
            "Visual Studio 18 2026"
          } else {
            "Visual Studio 17 2022"
          }
          if ("${{ matrix.compiler }}" -eq "msvc") {
            cmake -S . -B build -G "$generator" -A x64 `
              -DCMAKE_CXX_STANDARD=${{ matrix.std }} `
              -DPTN_BUILD_TESTS=ON `
              -DPTN_BUILD_BENCHMARKS=OFF `
              -DPTN_SKIP_COMPILER_CHECK=ON
          } else {
            cmake -S . -B build -G "$generator" -A x64 -T ClangCL `
              -DCMAKE_CXX_STANDARD=${{ matrix.std }} `
              -DPTN_BUILD_TESTS=ON `
              -DPTN_BUILD_BENCHMARKS=OFF `
              -DPTN_SKIP_COMPILER_CHECK=ON
          }

      # Linux: configure
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
            -DPTN_BUILD_TESTS=ON \
            -DPTN_BUILD_BENCHMARKS=OFF \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DPTN_SKIP_COMPILER_CHECK=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # CMake/MSBuild initializes the compiler environment for builds,
      # but compile-fail tests invoke cl.exe directly from CTest.
      - name: Set MSVC include paths for compile-fail tests
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ tools were not found" }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $include = & cmd.exe /d /c "call `"$devcmd`" -no_logo -arch=x64 -host_arch=x64 >nul && set INCLUDE"
          if ($LASTEXITCODE -ne 0 -or -not ($include -match '^INCLUDE=')) {
            throw "Could not initialize the MSVC include paths"
          }
          $include | Where-Object { $_ -match '^INCLUDE=' } | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload test log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}-${{ matrix.compiler }}-cxx${{ matrix.std }}
          path: build/Testing/Temporary/LastTest.log
