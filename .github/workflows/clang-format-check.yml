name: clang-format Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Docs-only pull requests skip the work below; see
      # scripts/ci_changes.py. Jobs that branch protection requires keep
      # running and skip only their steps, so their check names are still
      # reported.
      - id: detect
        run: python3 scripts/ci_changes.py

  clang-format:
    runs-on: ubuntu-24.04
    needs: changes

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.12"

      - name: Check formatting of changed C/C++ files
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          # Installs the clang-format pinned in tools/requirements.txt.
          python scripts/format.py --check --base "$base_sha" --head "$head_sha"
